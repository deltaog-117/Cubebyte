[package]
name = "minecraft_clone"
version = "0.1.0"
edition = "2024"
authors = ["deltaog-117"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.34.1"
pollster = "1.0.1"
thiserror = "2"
tracing = "0.1"
wgpu = "27"
winit = "0.30"

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "chunk"
harness = false

[[bench]]
name = "rng"
harness = false

[[bench]]
name = "generation"
harness = false

[[bench]]
name = "meshing"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
